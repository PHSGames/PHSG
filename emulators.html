<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portland Games | Emulators</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="cssbuttons-io.css" />
</head>
<body>
  <div class="stars"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>

  <!-- Top bar -->
  <div id="top">
    <button class="cssbuttons-io" id="homeButton">
      <span>Home</span>
    </button>
  </div>

  <!-- Emulator selection -->
  <div style="text-align:center; margin-top: 80px;">
    <h1 style="color:white;">Choose Your Emulator</h1>
    <div style="margin-top:40px;">
      <button class="cssbuttons-io" id="retroButton">
        <span>Nintendo & Sega</span>
      </button>
      <button class="cssbuttons-io" id="ps1Button" style="margin-left:20px;">
        <span>PlayStation 1</span>
      </button>
    </div>
  </div>

  <script>
    // Home button
    document.getElementById('homeButton').addEventListener('click', function() {
      window.location.href = 'PHSG/index.html'; // adjust if home is a different file
    });

    // Emulator buttons
    document.getElementById('retroButton').addEventListener('click', function() {
      window.location.href = '/emulator/index.html'; // make this page in your repo
    });

    document.getElementById('ps1Button').addEventListener('click', function() {
      window.location.href = '/PlayStation-main/PlayStation.htm'; // make this page in your repo
    });
  </script>
</body>
</html>
